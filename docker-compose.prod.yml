# Production stack on a single VPS:
#   docker compose --env-file .env.production -f docker-compose.prod.yml pull
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d
# The app image comes from GHCR (MTR_TAG: main, latest, a release like 1.2.3, or sha-abc1234).
# To build it locally instead, add --build to `up`.
# Reads secrets from .env.production (copy .env.production.example).
name: mt-ranked

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mtr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: mtr
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mtr"]
      interval: 3s
      retries: 30
    restart: unless-stopped

  # pg_dump on start and then daily into BACKUP_DIR; see deploy/backup.sh and "Backups" in README
  backup:
    image: postgres:17-alpine
    entrypoint: ["sh", "/backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: mtr
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      PGDATABASE: mtr
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    restart: unless-stopped

  # migrations + seed, then API, realtime server and Caddy (see deploy/start.mjs)
  app:
    image: ghcr.io/aamirazad/mtranked:${MTR_TAG:-main}
    build:
      context: .
      args:
        PUBLIC_SOURCE_URL: ${PUBLIC_SOURCE_URL:-}
        PUBLIC_CONTACT_EMAIL: ${PUBLIC_CONTACT_EMAIL:-}
        PUBLIC_SENTRY_DSN: ${PUBLIC_SENTRY_DSN:-}
      secrets: [sentry_auth_token]
    env_file: .env.production
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://mtr:${POSTGRES_PASSWORD}@postgres:5432/mtr}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes: [caddy_data:/data, caddy_config:/config]
    # SIGTERM drains races in progress for up to 150s before exiting (see realtime/src/index.ts)
    stop_grace_period: 3m
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    restart: unless-stopped

# optional: lets a local frontend build upload source maps to Sentry
secrets:
  sentry_auth_token:
    environment: SENTRY_AUTH_TOKEN

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
