# Tests for every pull request. Also called by deploy.yml (with `production: true`) so main is
# tested before it ships; that run also makes the production build deploy.yml uploads.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_call:
    inputs:
      production:
        description: Build with production settings and upload the Worker build for deploy.yml
        type: boolean
        default: false
    secrets:
      SENTRY_AUTH_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  # a new push, retitle or base change supersedes the run in progress; edits that
  # change neither (e.g. the description) get their own group so they can't cancel it
  group: ci-${{ github.event.pull_request.number || github.ref }}${{ github.event.action == 'edited' && !github.event.changes.title && !github.event.changes.base && format('-noop-{0}', github.run_id) || '' }}
  # only pull requests cancel: when called from deploy.yml a cancelled run would mark
  # the commit on main as failed (see deploy.yml)
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check, test and build
    # edits other than the title or base don't change anything that's tested
    if: github.event.action != 'edited' || github.event.changes.title || github.event.changes.base
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-ci-${{ github.sha }}
          restore-keys: turbo-ci-
      - name: Type check and unit tests
        run: pnpm turbo run check test
      - name: Build (frontend + Worker)
        if: ${{ !inputs.production }}
        run: pnpm turbo run build --filter=@mtr/worker
      - name: Build for production
        if: ${{ inputs.production }}
        env:
          PUBLIC_SOURCE_URL: ${{ vars.PUBLIC_SOURCE_URL || format('{0}/{1}', github.server_url, github.repository) }}
          PUBLIC_CONTACT_EMAIL: ${{ vars.PUBLIC_CONTACT_EMAIL }}
          PUBLIC_SENTRY_DSN: ${{ vars.PUBLIC_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        # --force: the build tags this commit's Sentry release and uploads its source maps, so a
        # bundle replayed from the cache (built for an earlier commit) won't do
        run: pnpm turbo run build --filter=@mtr/worker --force
      - name: Upload the production build
        if: ${{ inputs.production }}
        uses: actions/upload-artifact@v7
        with:
          name: worker-build
          path: worker/.cloudflare/output
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      - name: Migrations apply to a fresh database
        working-directory: worker
        run: |
          pnpm db:migrate
          # applied migrations are recorded: a second run must be a no-op
          pnpm db:migrate
