# Tests, then builds, smoke tests and pushes the app image to GHCR.
#   push to main      -> ghcr.io/<owner>/<repo>:main and :sha-<short sha>
#   tag v1.2.3        -> :1.2.3, :1.2, :1 (from v1 on), :latest and :sha-<short sha>
#   tag v1.2.3-rc.1   -> :1.2.3-rc.1 and :sha-<short sha> (pre-releases never move latest)
name: Publish

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # a newer commit on main supersedes an older one still in progress
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    uses: ./.github/workflows/ci.yml

  image:
    name: Build and push image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            type=sha,format=short
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: mtranked:smoke
          build-args: &build-args |
            VERSION=${{ steps.meta.outputs.version }}
            PUBLIC_SOURCE_URL=${{ vars.PUBLIC_SOURCE_URL || format('{0}/{1}', github.server_url, github.repository) }}
            PUBLIC_CONTACT_EMAIL=${{ vars.PUBLIC_CONTACT_EMAIL }}
            PUBLIC_SENTRY_DSN=${{ vars.PUBLIC_SENTRY_DSN }}
          secrets: &secrets |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: bash scripts/smoke-test.sh mtranked:smoke
      - name: Push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: *build-args
          secrets: *secrets
          cache-from: type=gha
      - name: Summary
        run: |
          {
            echo "### Pushed image"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
