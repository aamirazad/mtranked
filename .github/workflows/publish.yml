# Tests, builds and smoke tests the app image, then publishes it to GHCR.
#   push to main      -> ghcr.io/<owner>/<repo>:main and :sha-<short sha>
#   tag v1.2.3        -> :1.2.3, :1.2, :1 (from v1 on), :latest and :sha-<short sha>
#   tag v1.2.3-rc.1   -> :1.2.3-rc.1 and :sha-<short sha> (pre-releases never move latest)
# Tests and the image build run in parallel. The image is pushed as :sha-<short sha>
# once its smoke test passes, and only gets its other tags after the tests pass too.
# Runs aren't cancelled when a newer commit lands, since a cancelled run marks its
# commit as failed. Instead every run finishes, and one whose commit is no longer the
# head of its branch by the time it would publish skips that step and still passes.
name: Publish

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    uses: ./.github/workflows/ci.yml

  image:
    name: Build image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.sha.outputs.image }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            type=sha,format=short
      - name: Commit tag
        id: sha
        env:
          META: ${{ steps.meta.outputs.json }}
        run: echo "image=$(jq -r '.tags[] | select(contains(":sha-"))' <<<"$META")" >> "$GITHUB_OUTPUT"
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: mtranked:smoke
          build-args: &build-args |
            VERSION=${{ steps.meta.outputs.version }}
            PUBLIC_SOURCE_URL=${{ vars.PUBLIC_SOURCE_URL || format('{0}/{1}', github.server_url, github.repository) }}
            PUBLIC_CONTACT_EMAIL=${{ vars.PUBLIC_CONTACT_EMAIL }}
            PUBLIC_SENTRY_DSN=${{ vars.PUBLIC_SENTRY_DSN }}
          secrets: &secrets |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: bash scripts/smoke-test.sh mtranked:smoke
      - name: Push commit tag
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.sha.outputs.image }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: *build-args
          secrets: *secrets
          cache-from: type=gha

  release:
    name: Publish tags
    needs: [test, image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check this is still the latest commit
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # tags always publish; on a branch, a newer commit's run publishes instead so
          # an older run finishing late can't move :main backwards
          head=$GITHUB_SHA
          if [ "$GITHUB_REF_TYPE" = branch ]; then
            head=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" --jq .sha)
          fi
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Superseded by $head on $GITHUB_REF_NAME, not publishing tags"
          fi
      - uses: docker/setup-buildx-action@v4
        if: steps.latest.outputs.latest == 'true'
      - uses: docker/login-action@v4
        if: steps.latest.outputs.latest == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the tested image
        if: steps.latest.outputs.latest == 'true'
        env:
          IMAGE: ${{ needs.image.outputs.image }}
          TAGS: ${{ needs.image.outputs.tags }}
        run: |
          args=()
          while read -r tag; do [ -n "$tag" ] && args+=(-t "$tag"); done <<<"$TAGS"
          docker buildx imagetools create "${args[@]}" "$IMAGE"
          {
            echo "### Published $IMAGE"
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
