<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#323437" />
    <meta name="description" content="Competitive typing races. Ranked 1v1, casual quick match and private rooms with friends." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/fonts/RobotoMono-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <title>mt ranked</title>
    <script>
      // apply the saved theme before first paint (see lib/prefs.svelte.ts)
      try {
        const v = JSON.parse(localStorage.getItem("theme-vars") || "null");
        if (v) for (const k in v) document.documentElement.style.setProperty(k, v[k]);
      } catch {}
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
